<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Фірмовий фон (квадратний із трохи заокругленими кутами) -->
  <rect width="32" height="32" rx="3.5" fill="#5E8B7E" />
  
  <!-- Довша лінія тексту вище (піднята до y="6") -->
  <rect x="7" y="6" width="18" height="2.75" rx="1.375" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Коротша лінія тексту нижче (піднята до y="11") -->
  <rect x="7" y="11" width="11" height="2.75" rx="1.375" fill="#FFFFFF" opacity="0.65" />
  
  <!-- Галочка під лініями (по центру, 45° баланс) -->
  <path d="M10 22.5L14 26.5L22 18.5" fill="none" stroke="#FFFFFF" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
</svg>
